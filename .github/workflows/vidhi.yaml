name: myworkflow1
on:
  push:
    workflow_dispatch:
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
     - name: mystep1
       run: |
            cat /etc/os-release
            cd
            pwd
            docker --version
            docker compose version
     - name: mystep2-clone the repo in the current directory
